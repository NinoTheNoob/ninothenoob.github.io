<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nino — Portfolio & Socials</title>
  <!-- Clean modern + editorial serif fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <!-- FontAwesome for crisp Discord, YouTube, Steam, & Gaming icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --glass-bg: rgba(34, 62, 78, 0.42);
      --glass-card: rgba(255, 255, 255, 0.08);
      --glass-card-hover: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.18);
      --text-main: #f4f8fb;
      --text-muted: rgba(235, 245, 252, 0.72);
      --accent: #7dd3fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      /* Scenic misty blue/teal atmospheric wallpaper - swap URL with any anime/scenic image you like! */
      background: 
        linear-gradient(180deg, rgba(16, 36, 48, 0.35) 0%, rgba(12, 28, 38, 0.65) 100%),
        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=80') center/cover fixed no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Top Glass Navbar */
    .navbar {
      width: 100%;
      max-width: 1060px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 22px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      margin-bottom: 36px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--glass-border);
    }

    .nav-links {
      display: flex;
      gap: 18px;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .nav-socials {
      display: flex;
      gap: 10px;
    }

    .nav-socials a {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      display: grid;
      place-items: center;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .nav-socials a:hover {
      background: var(--glass-card-hover);
      transform: translateY(-2px);
    }

    /* Hero Header */
    .hero-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .hero-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .hero-header p {
      font-size: 0.72rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Main 2-Column Bento Grid */
    .grid-container {
      width: 100%;
      max-width: 1060px;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 22px;
      align-items: start;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Frosted Glass Panel */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
    }

    /* Profile Card (Top Left) */
    .profile-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .profile-info h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .profile-subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    /* Quick Action Pills (Discord, YouTube, Steam, Extra) */
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .pill-btn {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 7px 13px;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 68px;
      transition: all 0.2s ease;
    }

    .pill-btn:hover {
      background: var(--glass-card-hover);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .pill-btn span.tag {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    .pill-btn span.label {
      font-size: 0.78rem;
      font-weight: 600;
      margin-top: 1px;
    }

    .about-title {
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .about-text {
      font-size: 0.8rem;
      line-height: 1.55;
      color: var(--text-muted);
    }

    .avatar-circle {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 3px solid rgba(255, 255, 255, 0.28);
      overflow: hidden;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Section Headings */
    .section-heading {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .right-section-label {
      text-align: right;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: -8px;
      padding-right: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    /* Discord Presence Card */
    .discord-box {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .discord-avatar-wrap {
      position: relative;
      width: 54px;
      height: 54px;
    }

    .discord-avatar-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--glass-border);
    }

    .status-dot {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #747f8d; /* offline default */
      border: 2px solid #1e3847;
    }

    .discord-details h4 {
      font-size: 0.
